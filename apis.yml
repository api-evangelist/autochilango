name: AutoChilango
description: >-
  AutoChilango (Auto Chilango) is a Mexico City-based mobile application that consolidates
  the everyday services drivers in CDMX and the State of Mexico need into a single app. It
  covers the "Hoy No Circula" driving-restriction calendar, vehicular verification schedules,
  traffic fines (multas) lookup and payment, annual registration (tenencia), insurance,
  parking, gas stations, and mechanical services for private cars, motorcycles, taxis, and
  special plates. Backed by 500 Global and added to the API Evangelist network as a company
  profile; no public developer/API surface has been found, so this profile captures the
  provider's identity, information surface (blog, FAQs, privacy), and probed domain security.
